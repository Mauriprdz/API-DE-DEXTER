<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ character.name }} - Dexter API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-dna"></i> Dexter API</h1>
            <p>Detalle del personaje</p>
        </div>
    </header>

    <main class="container">
        <div class="character-detail">
            <div class="character-detail-image">
                {% if character.image %}
                    <img src="{{ url_for('static', filename=character.image) }}" alt="{{ character.name }}">
                {% else %}
                    <div class="no-image"><i class="fas fa-user fa-4x"></i><br>Sin imagen</div>
                {% endif %}
            </div>
            
            <div class="character-detail-info">
                <h2>{{ character.name }}</h2>
                <p class="actor"><i class="fas fa-theater-masks"></i> Interpretado por: {{ character.actor }}</p>
                <div class="description">
                    <h3><i class="fas fa-info-circle"></i> Descripción</h3>
                    <p>{{ character.description }}</p>
                </div>
                <div class="actions">
                    <a href="{{ url_for('index') }}" class="btn-back"><i class="fas fa-arrow-left"></i> Volver a la lista</a>
                    <button class="btn-edit" data-id="{{ character.id }}"><i class="fas fa-edit"></i> Editar personaje</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p><i class="fas fa-code"></i> Dexter API MAURICIO ALEJANDRO PRIETO RODRIGUEZ &copy; 2025</p>
            
            </div>
        </div>
    </footer>

    <script>
        document.querySelector('.btn-edit').addEventListener('click', function() {
            window.location.href = `/?edit=${this.dataset.id}`;
        });
    </script>
</body>
</html>
